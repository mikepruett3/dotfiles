---



- name: "Install Visual Studio Code"
  ansible.builtin.include_role:
    #name: gantsign.visual-studio-code
    name: ansible-role-visual-studio-code
  when:
    - desktop is defined
    - ansible_facts['pkg_mgr'] != 'pacman'

- name: "Install Visual Studio Code (paru)"
  ansible.builtin.shell:
    cmd: paru -S --needed --noconfirm --noprogressbar visual-studio-code-bin
  become: yes
  become_user: "{{ regular_user }}"
  when:
    - desktop is defined
    - ansible_facts['pkg_mgr'] == 'pacman'
    - aur_helper == 'paru'

- name: "Install Visual Studio Code (yay)"
  ansible.builtin.shell:
    cmd: yay -S --needed --noconfirm --noprogressbar visual-studio-code-bin
  become: yes
  become_user: "{{ regular_user }}"
  when:
    - desktop is defined
    - ansible_facts['pkg_mgr'] == 'pacman'
    - aur_helper == 'yay'
