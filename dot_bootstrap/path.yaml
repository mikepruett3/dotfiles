---
# This playbook adds a directory to the PATH in a shell startup file
# Usage: include_tasks with vars:
#   path_to_add: "$HOME/bin"
#   startup_file: "~/.bashrc"  (optional, defaults to ~/.bashrc)

- name: "Set default startup file"
  ansible.builtin.set_fact:
    startup_file: "~/.bashrc"
  when:
    - startup_file is not defined

- name: "Read startup file contents"
  ansible.builtin.slurp:
    src: "{{ startup_file | expanduser }}"
  register: startup_file_content
  become: true
  become_user: "{{ regular_user }}"

- name: "Decode file content"
  ansible.builtin.set_fact:
    file_content: "{{ startup_file_content['content'] | b64decode }}"

- name: "Check if {{ path_to_add | replace('$HOME', '~') }} is already in PATH"
  ansible.builtin.set_fact:
    path_already_present: "{{ path_to_add in file_content }}"

- name: "Check if PATH line exists"
  ansible.builtin.set_fact:
    path_line_exists: "{{ file_content is search('export PATH=') }}"

- name: "Add {{ path_to_add | replace('$HOME', '~') }} to existing PATH line"
  ansible.builtin.shell:
    cmd: sed -i '/^export PATH=/s|export PATH="|export PATH="{{ path_to_add }}:|' {{ startup_file }}
  become: true
  become_user: "{{ regular_user }}"
  when:
    - path_line_exists | bool
    - not path_already_present | bool

- name: "Add PATH line to {{ startup_file }} (no existing PATH found)"
  ansible.builtin.lineinfile:
    path: "{{ startup_file }}"
    line: 'export PATH="{{ path_to_add }}:$PATH"'
    state: present
  become: true
  become_user: "{{ regular_user }}"
  when:
    - not path_line_exists | bool





